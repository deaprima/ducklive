[project]
name = "ducklive"
dynamic = ["version"]
description = "Timer & milestone subathon untuk live YouTube, dengan overlay OBS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Depends(...) di argumen default adalah pola FastAPI
    "SIM105", # try/except/pass lebih jelas daripada contextlib.suppress di sini
]

[tool.pytest.ini_options]
testpaths = ["tests"]
